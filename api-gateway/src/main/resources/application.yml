server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/users/**
        - id: driver-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/drivers/**
        - id: trip-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/trips/**
        - id: location-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/locations/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
