server:
  port: 8080

spring:
  application:
    name: api-gateway
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://localhost:7080/realms/ride-hailing-realm
          jwk-set-uri: http://localhost:7080/realms/ride-hailing-realm/protocol/openid-connect/certs
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/users/**
        - id: driver-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/drivers/**
        - id: trip-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/trips/**
        - id: location-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/locations/**
        - id: notification-service
          uri: lb:ws://localhost:8086
          predicates:
            - Path=/ws/**
        - id: notification-rest
          uri: http://localhost:8086
          predicates:
            - Path=/api/v1/notifications/**
        - id: admin-routes
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/admin/**

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
